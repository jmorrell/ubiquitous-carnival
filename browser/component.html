<!doctype html>
<html><head><meta charset="utf-8">
<style>
body{font:14px system-ui,sans-serif;margin:0;color:#20372d}
video{display:block;background:#223b34;width:100%;max-height:210px;border-radius:6px}
button{display:block;border:1px solid #c9d9cf;border-radius:5px;background:#f7fbf8;color:#173c2d;padding:8px 10px;margin:7px 0;text-align:left;cursor:pointer}
button[aria-current="true"]{background:#d4ecdf;border-color:#4b8162}
output{display:block;font-variant-numeric:tabular-nums;margin:7px 0}
</style></head>
<body>
<video controls playsinline muted aria-label="Archived video"></video>
<output id="time">0.00 seconds</output>
<div id="cues"></div>
<p id="message" role="status">Loading…</p>
<script>
(() => {
  const transcriptArtifact = __MAGPIE_TRANSCRIPT_ARTIFACT__;
  let port;
  let serial = 0;
  let segments = [];
  const pending = new Map();
  const video = document.querySelector("video");
  function read(artifact, range) {
    return new Promise((resolve, reject) => {
      const id = String(++serial);
      pending.set(id, { resolve, reject });
      port.postMessage({ id, method: "read", artifact, range });
    });
  }
  // This is the complete viewer-facing capability surface.
  window.magpie = Object.freeze({ read });
  function update() {
    document.querySelector("#time").textContent = video.currentTime.toFixed(2) + " seconds";
    [...document.querySelectorAll("#cues button")].forEach((button, i) => {
      const segment = segments[i];
      button.setAttribute("aria-current", String(video.currentTime * 1000 >= segment.startMs && video.currentTime * 1000 < segment.endMs));
    });
  }
  video.addEventListener("timeupdate", update);
  window.addEventListener("message", async (event) => {
    if (port || event.source !== parent || event.data?.type !== "magpie:init" || event.ports.length !== 1) return;
    port = event.ports[0];
    const context = event.data.context;
    port.onmessage = ({ data }) => {
      const waiting = pending.get(data.id);
      if (!waiting) return;
      pending.delete(data.id);
      data.ok ? waiting.resolve(data) : waiting.reject(new Error(data.error));
    };
    try {
      const original = context.item.artifacts.find((a) => a.mediaType.startsWith("video/"));
      if (!original) throw new Error("No video original");
      const transcript = await read(transcriptArtifact);
      segments = JSON.parse(new TextDecoder().decode(transcript.bytes)).segments;
      const media = await read(original.id);
      const loaded = new Promise((resolve, reject) => {
        video.addEventListener("loadedmetadata", resolve, { once: true });
        video.addEventListener("error", () => reject(new Error("Archived video could not load")), { once: true });
      });
      video.src = URL.createObjectURL(new Blob([media.bytes], { type: media.mediaType }));
      await loaded;
      segments.forEach((segment) => {
        const button = document.createElement("button");
        button.textContent = (segment.startMs / 1000).toFixed(1) + "s · " + segment.text;
        button.onclick = () => {
          video.currentTime = segment.startMs / 1000;
          update();
        };
        document.querySelector("#cues").append(button);
      });
      document.querySelector("#message").textContent = "Ready";
    } catch (error) {
      document.querySelector("#message").textContent = error.message;
    }
  });
  parent.postMessage({ type: "magpie:ready" }, "*");
})();
</script>
</body></html>
